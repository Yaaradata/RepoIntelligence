score_version: v001

usefulness_weights:
  technical_usefulness: 0.26
  product_usefulness:   0.22
  actionability:        0.18
  maturity:             0.14
  novelty:              0.12
  explainability:       0.08

evidence_factor:
  base:  0.70
  slope: 0.03          # 0.70 + 0.03 * evidence_strength → 0.70 … 1.00

# Total must stay <= 1.4 so 8.5 blinded usefulness with no boosts beats 7.0
# with every boost maxed (tests/unit/test_scoring_property.py).
boost_caps:
  momentum:   0.6
  adoption:   0.4
  showhn:     0.3
  popularity: 0.5
  total:      1.4

lane_weights:          # which signals matter per lane (spec values; accelerating sums to 1.10)
  new:          {stars_lifetime: 0.00, star_growth: 0.15, accel: 0.10,
                 docs: 0.25, commits: 0.15, releases: 0.05,
                 contributors: 0.05, adoption: 0.00, showhn: 0.25}
  accelerating: {stars_lifetime: 0.05, star_growth: 0.30, accel: 0.20,
                 docs: 0.10, commits: 0.10, releases: 0.10,
                 contributors: 0.10, adoption: 0.05, showhn: 0.10}
  established:  {stars_lifetime: 0.10, star_growth: 0.10, accel: 0.05,
                 docs: 0.10, commits: 0.05, releases: 0.30,
                 contributors: 0.10, adoption: 0.20, showhn: 0.05}
  popular:      {stars_lifetime: 0.20, star_growth: 0.20, accel: 0.10,
                 docs: 0.10, commits: 0.05, releases: 0.15,
                 contributors: 0.05, adoption: 0.15, showhn: 0.05}
